version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./data:/app/data
      - spark-temp:/tmp/spark-temp
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    deploy:
      resources:
        limits:
          memory: 8G
    depends_on:
      - mlflow
    networks:
      - mlflow-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow
    networks:
      - mlflow-network

networks:
  mlflow-network:
    driver: bridge

volumes:
  mlflow_data:
  spark-temp:
